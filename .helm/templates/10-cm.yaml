kind: ConfigMap
apiVersion: v1
metadata:
  name: nginx-config
  annotations:
    werf.io/weight: "1"
data:
  nginx.conf: |-
    worker_processes auto;

    error_log /dev/stderr warn;
    pid       /tmp/nginx.pid;

    events {
      worker_connections 1024;
      multi_accept on;
    }

    http {
      include               /etc/nginx/mime.types;
      default_type          application/octet-stream;

      client_body_temp_path /tmp/client_temp;
      proxy_temp_path       /tmp/proxy_temp;
      fastcgi_temp_path     /tmp/fastcgi_temp;
      uwsgi_temp_path       /tmp/uwsgi_temp;
      scgi_temp_path        /tmp/scgi_temp;


      access_log off;

      log_format json_combined escape=json '{ "time_local": "$time_local", '
        '"host": "$host", '
        '"remote_addr": "$remote_addr", '
        '"remote_user": "$remote_user", '
        '"request": "$request", '
        '"status": "$status", '
        '"body_bytes_sent": "$body_bytes_sent", '
        '"request_time": "$request_time", '
        '"http_referrer": "$http_referer", '
        '"http_user_agent": "$http_user_agent" }';

      keepalive_timeout  65;

      ssi off;
      gzip off;
      port_in_redirect off;
      absolute_redirect off;

      set_real_ip_from 0.0.0.0/0;
      real_ip_header X-Forwarded-For;

      resolver {{ .Values.resolver }} valid=10s;

      proxy_buffer_size 8k;
      fastcgi_buffers 8 16k;
      fastcgi_buffer_size 16k;

      map $host $lang {
          hostnames;
          "deckhouse.ru"   "ru";
          "*.deckhouse.ru"   "ru";
          # for test environments
          "deckhouse-ru.*" "ru";
          default       "en";
      }

      proxy_cache_path /tmp/cache levels=1 keys_zone=cache:1m max_size=1g inactive=7d use_temp_path=off;

      server {
        listen   8080;
        server_name _;

        root   /app;
        index  index.html readme.html;
        error_page 403 404 /$lang/documentation/404/;

        charset utf-8;
        access_log     /dev/stdout json_combined;

        proxy_intercept_errors on;
        recursive_error_pages on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;

        set $log_location "undef";

        rewrite /overview/ /products/prompp/documentation/ redirect;

        location ~* ^/products/prompp/(?<path>documentation/downloads/print/.+)$ {
            try_files /$lang/$path /$path/ =404;
        }

        location ~ /downloads/source/(?<path>.+(?<ext>\.tar\.gz|\.zip))$ {
          set $download_url https://github.com/deckhouse/prompp/archive/$path;
          set $log_location "source";

          add_header Content-Disposition "attachment; filename=prompp-source$ext";

          proxy_pass $download_url;
          error_page 302 = @handle_redirect;
        }

        location ~ /downloads/latest/(?<file>.+)$ {
          set $download_url https://github.com/deckhouse/prompp/releases/latest/download/$file;
          set $log_location "downloads";

          add_header Content-Disposition "attachment; filename=$file";

          proxy_pass $download_url;
          error_page 302 = @handle_redirect;
        }

        location ~ /downloads/(?<version>[^/]+)/(?<file>.+)$ {
          set $download_url https://github.com/deckhouse/prompp/releases/download/$version/$file;
          set $log_location "downloads";

          add_header Content-Disposition "attachment; filename=$file";

          proxy_pass $download_url;
          error_page 302 = @handle_redirect;
        }

        location @handle_redirect {
          internal;

          set $log_location "downloads";
          set $location $upstream_http_location;

          error_page 302 = @handle_redirect;

          proxy_pass $location;
          proxy_cache_key $uri;
          proxy_cache cache;
          proxy_cache_valid 200 1h;
          proxy_cache_valid 404 1m;
          proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
          proxy_cache_lock on;
          proxy_cache_revalidate on;
          proxy_cache_background_update on;
        }

        location /link_test_report.txt {
            deny all;
        }

        location = /healthz {
            access_log  off;
            add_header Content-Type text/plain;
            return 200;
        }

        # Serve generated Markdown outputs (llms.txt links to *.md) as text/plain.
        location ~* ^/products/{{ .Values.productCode }}/(?<path>(documentation|guides|modules|gs|reference)/.*\.md)$  {
            default_type text/plain;
            try_files /$lang/$path /$lang/$path/index.html /$lang/$path/ $path $path/index.html $path/ =404;
        }

        location ~* ^/products/{{ .Values.productCode }}/(?<path>(documentation|guides|modules|gs|reference|images)/.*)$  {
            try_files /$lang/$path /$lang/$path/index.html /$lang/$path/ $path $path/index.html $path/ =404;
        }

        location / {
            try_files /$lang/$uri /$lang/$uri/index.html /$lang/$uri/ $uri $uri/index.html $uri/ =404;
        }
      }
    }
