{{- $productCode := .Values.global.product_code }}
{{- $hostEn := .Values.global.url }}
{{- $hostRu := .Values.global.url_ru }}
{{- $hosts := list -}}
{{- $hosts = append $hosts (dict "Lang" "en" "URL" $hostEn) -}}
{{- $hosts = append $hosts (dict "Lang" "ru" "URL" $hostRu) -}}

{{- range $hosts }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main-{{ .Lang }}
  annotations:
    nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: '*'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-Original-URI         $request_uri;
      ssi on;
      ssi_silent_errors on;
{{- if ne $.Values.web.env "production" }}
    nginx.ingress.kubernetes.io/auth-signin: https://$host/dex-authenticator/sign_in
    nginx.ingress.kubernetes.io/auth-url: https://{{ $.Chart.Name }}-{{ .Lang }}-dex-authenticator.deckhouse-web-{{ $productCode }}-{{ $.Values.web.env }}.svc.cluster.local/dex-authenticator/auth
    nginx.ingress.kubernetes.io/auth-response-headers: X-Auth-Request-User,X-Auth-Request-Email
{{- end }}
spec:
  ingressClassName: {{ pluck $.Values.web.dc_name $.Values.ingressClass | first | default $.Values.ingressClass._default | quote }}
  tls:
  - hosts:
      - {{ .URL }}
{{- if eq $.Values.web.env "production" }}
      - www.{{ .URL }}
{{- end }}
{{- if eq $.Values.web.env "production" }}
    secretName: star-{{ .URL | replace "." "-" }}
{{- else }}
    secretName: tls-{{ .URL }}
{{- end }}
  rules:
  - host: {{ .URL }}
    http:
      paths:
      - path: /products/{{ $productCode }}/gs
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              name: http
      - path: /products/{{ $productCode }}/guides
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              name: http
      - path: /products/{{ $productCode }}/documentation
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              name: http
{{- if ne $.Values.web.env "production" }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $.Chart.Name }}-{{ .Lang }}-cert
  annotations:
    werf.io/fail-mode: IgnoreAndContinueDeployProcess
    werf.io/track-termination-mode: NonBlocking
spec:
  certificateOwnerRef: false
  secretName: tls-{{ .URL }}
  issuerRef:
    kind: ClusterIssuer
    name: {{ pluck $.Values.web.dc_name $.Values.certificateClusterIssuer | first | default $.Values.certificateClusterIssuer._default }}
  commonName: {{ .URL }}
  dnsNames:
  - {{ .URL }}
---
apiVersion: deckhouse.io/v1
kind: DexAuthenticator
metadata:
  name: {{ $.Chart.Name }}-{{ .Lang }}
spec:
  applicationDomain: {{ .URL }}
  sendAuthorizationHeader: false
  applicationIngressCertificateSecretName: tls-{{ .URL }}
  applicationIngressClassName: {{ pluck $.Values.web.dc_name $.Values.ingressClass | first | default $.Values.ingressClass._default | quote }}
  keepUsersLoggedInFor: "720h"
{{- end }}
---
{{ end -}}
