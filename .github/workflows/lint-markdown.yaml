name: Lint Markdown

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

jobs:
  lint-markdown:
    runs-on: ubuntu-latest
    name: Lint Markdown Files
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run markdownlint
        run: make lint-markdown

