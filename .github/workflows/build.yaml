name: Build

on:
  pull_request_target:
     types:
      - opened
      - synchronize
      - reopened

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Hugo Site
    container:
      image: hugomods/hugo:debian-ci-0.150.1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build Hugo site
        run: hugo --minify
